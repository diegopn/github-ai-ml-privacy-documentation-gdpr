name: Publicar site Quarto

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Preparar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Instalar pacotes usados pelo site
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::jsonlite any::knitr any::rmarkdown any::yaml

      - name: Renderizar site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Preparar artefato Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
