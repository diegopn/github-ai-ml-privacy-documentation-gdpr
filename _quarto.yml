project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd

execute:
  echo: false

website:
  # A marca curta mantém o cabeçalho da publicação consistente com o site
  # principal; o título completo continua visível no bloco editorial da página.
  title: "Diego Pereira"
  site-url: https://diegopn.github.io/github-ai-ml-privacy-documentation-gdpr/
  favicon: site/favicon.png
  search: false
  navbar:
    background: light
    pinned: true
    collapse: true
    left:
      - href: index.qmd
        text: Início
      - href: index.qmd#resultados
        text: Resultados
      - href: index.qmd#dados
        text: Dados coletados
      - href: index.qmd#metodologia
        text: Metodologia
      - href: index.qmd#reproducao
        text: Reprodução
    right:
      - text: Portfólio
        href: https://diegopn.github.io/
      - icon: github
        href: https://github.com/diegopn/github-ai-ml-privacy-documentation-gdpr
        aria-label: GitHub
  page-footer:
    left: "Diego Pereira do Nascimento · Pesquisa, tecnologia e liderança"
    right: "Experimento de documentação de privacidade · Licença MIT"

format:
  html:
    lang: pt-BR
    theme: cosmo
    css: site/styles.css
    toc: true
    page-layout: full
    smooth-scroll: true
    embed-resources: true

resources:
  - inputs
  - outputs
