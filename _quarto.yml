project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd

execute:
  echo: false

website:
  title: "Documentação de privacidade em projetos de IA/ML"
  site-url: https://diegopn.github.io/github-ai-ml-privacy-documentation-gdpr/
  favicon: site/favicon.png
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Início
      - href: index.qmd#resultados
        text: Resultados
      - href: index.qmd#dados
        text: Dados coletados
      - href: index.qmd#metodologia
        text: Metodologia
      - href: index.qmd#reproducao
        text: Reprodução
    right:
      - icon: github
        href: https://github.com/diegopn/github-ai-ml-privacy-documentation-gdpr
        aria-label: GitHub
  page-footer:
    left: "Experimento de documentação de privacidade"
    right: "Licença MIT"

format:
  html:
    lang: pt-BR
    theme: cosmo
    css: site/styles.css
    toc: true
    page-layout: full
    smooth-scroll: true
    embed-resources: true

resources:
  - inputs
  - outputs
